# Windows and Linux releases: the runtime executable and the kit that builds the game from the player's ROM on its
# first start (runtime/game_build.c, scripts/package.py). Nothing here touches a ROM or ROM-derived data: the runtime
# is built with EGG_RUNTIME_ONLY, and the package script refuses generated code, extracted files, ROMs and saves.
# A pushed tag v* publishes a GitHub release with the packages; a manual run uploads them as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  LLVM: llvm-mingw-20261020-ucrt-x86_64
  SDL: SDL3-3.4.18
  FFMPEG: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1
  FFMPEG_LINUX: ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1
  CURL: curl-8.23.0_8-win64-mingw
  LIBRASHADER: librashader-v0.12.0

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          mkdir -p deps && cd deps
          curl -sSLfo llvm.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$LLVM.zip
          curl -sSLfo sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-mingw.zip
          curl -sSLfo ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$FFMPEG.zip
          curl -sSLfo curl.zip https://curl.se/windows/dl-8.23.0_8/$CURL.zip
          curl -sSLfo python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          curl -sSLfo dsd.exe https://github.com/AetiasHax/ds-decomp/releases/download/v0.12.1/dsd-windows-x86_64.exe
          curl -sSLfo dsd-LICENSE.txt https://raw.githubusercontent.com/AetiasHax/ds-decomp/v0.12.1/LICENSE
          curl -sSLfo xdelta3.zip https://github.com/jmacd/xdelta/releases/download/v3.2.2/xdelta3-3.2.2-windows-x86_64.zip
          curl -sSLfo xdelta3-LICENSE.txt https://raw.githubusercontent.com/jmacd/xdelta/v3.2.2/xdelta3/LICENSE
          for z in llvm sdl ffmpeg curl xdelta3; do python -m zipfile -e $z.zip .; done
          pip install ninja

      # Slang shader mods (runtime/shader.c): librashader with only its OpenGL runtime, and the C runtime linked in,
      # so the DLL needs nothing beyond Windows itself (the published DLLs also need D3DX9 and the MSVC runtime).
      - name: librashader
        run: |
          git clone -q --depth 1 --branch $LIBRASHADER https://github.com/SnowflakePowered/librashader deps/librashader
          cd deps/librashader
          RUSTFLAGS="-C target-feature=+crt-static" cargo run -p librashader-build-script -- --profile optimized \
            -- --no-default-features --features runtime-opengl

      - name: Build the runtime
        run: |
          export PATH="$PWD/deps/$LLVM/bin:$PATH"
          # CMake needs Windows paths: Git Bash leaves /d/a/... unconverted in a ;-separated list.
          DEPS="$(pwd -W)/deps"
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DEGG_RUNTIME_ONLY=ON \
            "-DCMAKE_PREFIX_PATH=$DEPS/$SDL/x86_64-w64-mingw32;$DEPS/$FFMPEG;$DEPS/$CURL" \
            "-DEGG_VERSION=$GITHUB_REF_NAME" "-DFETCHCONTENT_BASE_DIR=$DEPS/fetch"
          cmake --build build

      - name: Package
        run: |
          python -I scripts/package.py --build build --llvm deps/$LLVM --python-embed deps/python-embed.zip \
            --dsd deps/dsd.exe --dsd-license deps/dsd-LICENSE.txt --sdl deps/$SDL --ffmpeg deps/$FFMPEG \
            --curl deps/$CURL --rcheevos deps/fetch/rcheevos-src \
            --xdelta deps/xdelta3-3.2.2-windows-x86_64/xdelta3.exe --xdelta-license deps/xdelta3-LICENSE.txt \
            --librashader deps/librashader/target/optimized/librashader.dll --librashader-license deps/librashader/LICENSE.md \
            --out "dist/Egg of Time" --zip "dist/EggOfTime-${GITHUB_REF_NAME}-windows-x64.zip"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: EggOfTime-windows-x64
          path: dist/*.zip

  # The oldest supported Ubuntu, so the executable runs on distros with glibc 2.35 or newer. SDL3 is built from
  # source and linked in statically; FFmpeg's shared libraries go next to the executable (RPATH $ORIGIN). The same
# files go out as a .tar.gz and as an AppImage.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev             libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev             libgl1-mesa-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev libasound2-dev libpulse-dev             libcurl4-openssl-dev
          mkdir -p deps && cd deps
          curl -sSLfo ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$FFMPEG_LINUX.tar.xz
          curl -sSLfo dsd https://github.com/AetiasHax/ds-decomp/releases/download/v0.12.1/dsd-linux-x86_64
          curl -sSLfo dsd-LICENSE.txt https://raw.githubusercontent.com/AetiasHax/ds-decomp/v0.12.1/LICENSE
          curl -sSLfo xdelta3.tar.gz https://github.com/jmacd/xdelta/releases/download/v3.2.2/xdelta3-3.2.2-linux-x86_64.tar.gz
          curl -sSLfo xdelta3-LICENSE.txt https://raw.githubusercontent.com/jmacd/xdelta/v3.2.2/xdelta3/LICENSE
          curl -sSLfo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -sSLfo runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          chmod +x appimagetool
          tar xf ffmpeg.tar.xz
          tar xf xdelta3.tar.gz

      - name: librashader
        run: |
          git clone -q --depth 1 --branch $LIBRASHADER https://github.com/SnowflakePowered/librashader deps/librashader
          cd deps/librashader
          cargo run -p librashader-build-script -- --profile optimized -- --no-default-features --features runtime-opengl

      - name: Build the runtime
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DEGG_RUNTIME_ONLY=ON             -DCMAKE_PREFIX_PATH="$PWD/deps/$FFMPEG_LINUX" -DFETCHCONTENT_BASE_DIR="$PWD/deps/fetch"             -DEGG_VERSION="$GITHUB_REF_NAME"
          cmake --build build

      - name: Package
        run: |
          python3 -I scripts/package.py --build build --dsd deps/dsd --dsd-license deps/dsd-LICENSE.txt             --sdl deps/fetch/sdl3-src --ffmpeg deps/$FFMPEG_LINUX             --rcheevos deps/fetch/rcheevos-src             --xdelta deps/xdelta3-3.2.2-linux-x86_64/xdelta3 --xdelta-license deps/xdelta3-LICENSE.txt             --librashader deps/librashader/target/optimized/librashader.so             --librashader-license deps/librashader/LICENSE.md             --out "dist/Egg of Time" --tar "dist/EggOfTime-${GITHUB_REF_NAME}-linux-x64.tar.gz"             --appimage "dist/EggOfTime-${GITHUB_REF_NAME}-x86_64.AppImage" --appimagetool deps/appimagetool             --appimage-runtime deps/runtime-x86_64

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: EggOfTime-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Egg of Time $GITHUB_REF_NAME" --notes-file res/release/README.txt
