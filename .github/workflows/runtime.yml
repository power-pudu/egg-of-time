# Portability check of the runtime on Linux and macOS. CI machines must not hold ROM-derived data, so the
# game library (generated from extract/ and config/) is not built here; EGG_RUNTIME_ONLY builds the executable
# with -Werror against SDL3, FFmpeg and libcurl. Full builds run locally with scripts/build.sh (Linux/macOS) or DESIGN.md (Windows).
name: runtime

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev libasound2-dev libpulse-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libcurl4-openssl-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl3 ffmpeg

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DEGG_RUNTIME_ONLY=ON

      - name: Build
        run: cmake --build build
